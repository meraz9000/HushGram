org.gradle.caching = true
# Local build resources: this machine, not the repository's CI floor. Gradle cannot interpolate
# the environment here, so a checkout on a smaller machine lowers these by hand. The
# configuration cache stays off: settings.gradle.kts reads its properties at configuration time.
org.gradle.jvmargs = -Xms1g -Xmx6g -XX:ActiveProcessorCount=8
org.gradle.parallel = true
org.gradle.workers.max = 4
org.gradle.priority = normal
# Test JVMs per task: the area tasks already run side by side under parallel builds, so this
# only splits a single area's or the extension suite's classes across forks.
hushgramTestForks = 2
android.useAndroidX = true
kotlin.code.style = official
version = 0.0.17
